name: keepalive-supabase

# O plano gratuito do Supabase pausa projetos com pouca atividade na semana. A doc fala em
# "algumas requisições por dia": com um ping a cada 3 dias o projeto pausou mesmo assim
# (encontrado INACTIVE em 2026-11-18, com todos os pings verdes). Agora roda 2x por dia.
on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco (usuário somente leitura)
        env:
          URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Secret SUPABASE_KEEPALIVE_URL não configurado"; exit 1; fi
          psql "$URL" -tAc "select count(*) from marts.dim_mes"
